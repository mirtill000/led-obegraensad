; Remote control for the OBEGRÄNSAD lamp on an M5Stack Cardputer ADV
; (ESP32-S3 StampS3A, 240x135 display, TCA8418 keyboard). It talks to the
; lamp over Bluetooth LE - see ../src/ble.cpp for the protocol.
;
;   cd cardputer && pio run -t upload
;
; (hold G0 while plugging in the USB cable if the upload doesn't start)

[env:cardputer-adv]
; Same platform release as the lamp.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; M5Cardputer straight from GitHub: its 1.2.0 release (Cardputer ADV
; keyboard support) isn't in the PlatformIO registry.
lib_deps =
    m5stack/M5Unified@^0.2.23
    m5stack/M5GFX@^0.2.30
    https://github.com/m5stack/M5Cardputer.git#1.2.0
