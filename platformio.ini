; PlatformIO project configuration
; Board: Sparkle IoT XH-S3E (ESP32-S3-WROOM-1-N16R8, 16MB flash / 8MB octal PSRAM)

[platformio]
default_envs = xhs3e

[env:xhs3e]
; Pinned to a fixed pioarduino release (Arduino core 3.3.9) instead of the
; floating "stable" link, so builds don't break when a new release is pushed.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8 module: 16MB flash, 8MB PSRAM wired in Octal mode
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

; Firmware version (git commit + build time) for the web page.
extra_scripts =
  pre:scripts/build_info.py
  pre:scripts/quotes.py

; If your board has no onboard USB-serial chip and enumerates only via the
; native USB-OTG port, uncomment the two lines below so Serial goes over USB:
; build_flags =
;     -DARDUINO_USB_MODE=1
;     -DARDUINO_USB_CDC_ON_BOOT=1

; Same firmware, uploaded over WiFi through the lamp's web page instead of
; USB:   pio run -e ota -t upload
; The lamp must already run a firmware with the update feature. To reach it
; by IP instead of name:   pio run -e ota -t upload --upload-port 192.168.1.50
[env:ota]
extends = env:xhs3e
upload_protocol = custom
upload_port = obegransad.local
upload_command = curl --fail --show-error --max-time 180 -F "firmware=@$SOURCE" http://$UPLOAD_PORT/api/update
